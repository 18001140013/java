# log4j.properties
# Log4j中定义的级别：fatal(致命错误) > error(错误) > warn(警告) > info(普通信息) > debug(调试信息)>trace(跟踪信息)
log4j.rootLogger=error , console , D
# mapper中的 namespace 配置，局部调高级别
log4j.logger.com.msb.mapper=TRACE
### console ###
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=[%p] [%-d{yyyy-MM-dd HH\:mm\:ss}] %C.%M(%L) | %m%n
### Log file ###
log4j.appender.D=org.apache.log4j.DailyRollingFileAppender
log4j.appender.D.File=/Users/terminus/01_java/a_01/log4j_cache/log4j.log
log4j.appender.D.Append=true
### 只能升级别，不能降
log4j.appender.D.Threshold=INFO
log4j.appender.D.layout=org.apache.log4j.PatternLayout
log4j.appender.D.layout.ConversionPattern=[%p] [%-d{yyyy-MM-dd HH\:mm\:ss}] %C.%M(%L) | %m%n
#### 格式符号说明：
## `%p`：日志级别
## `%d`：日期时间
## `%C`：全类名
## `%M`：方法名
## `%L`：行号
## `%m`：日志消息
## `%n`：换行